# A generic, single database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to use for the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded in the
# migration environment that are not otherwise on sys.path
# prepend_sys_path = sys.path

# version locations override; list of directories where
# version files are searched
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version path separator; as above we use os.pathsep.
# default path separator is ';'
# version_path_separator = ;

# set to 'true' to search source files recursively
# recursive_version_files = false

# the database URL is resolved dynamically in env.py from the settings config
sqlalchemy.url = postgresql://postgres:postgres@localhost/deal_crm

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
